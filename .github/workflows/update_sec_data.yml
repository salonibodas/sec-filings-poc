name: Update SEC Filings Data

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub website
  schedule:
    - cron: '0 0 1 * *' # Automatically runs on the 1st of every month

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sec-edgar-downloader

    - name: Run SEC Download Script
      run: python fetch_sec.py

    - name: Commit and push downloaded data back to repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sec_data/
        git commit -m "Auto-update SEC filings data up to 2026" || exit 0
        git push
